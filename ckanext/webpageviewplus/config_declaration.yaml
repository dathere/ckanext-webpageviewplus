version: 1
groups:
  - annotation: ckanext-webpageviewplus settings
    options:
      - key: ckanext.webpageviewplus.content_origin
        default: ""
        description: |
          Origin that serves uploaded HTML, e.g. https://example-usercontent.org.
          Must be a different registrable domain from CKAN's (not a
          subdomain), use https (http only for localhost), and be proxied to
          this same CKAN. Empty turns it off: uploads are framed from CKAN's
          own origin, sandboxed without allow-same-origin.

      - key: ckanext.webpageviewplus.signing_secret
        default: ""
        description: |
          HMAC key (32+ characters) for signed content URLs of private
          resources. Required with content_origin. Separate from CKAN's own
          secret so it can be rotated alone; rotating it invalidates signed
          URLs already handed out.

      - key: ckanext.webpageviewplus.url_ttl
        default: 300
        type: int
        description: |
          Length, in seconds, of the signing window for private resources'
          content URLs (a URL stays valid for one to two windows), and how
          long a viewer's browser may keep a private response.

      - key: ckanext.webpageviewplus.default_preset
        default: interactive
        description: |
          Preset for new views. Must be one of ckanext.webpageviewplus.presets.

      - key: ckanext.webpageviewplus.presets
        default: strict interactive external data-schematic
        type: list
        description: |
          Space-separated presets editors may choose from: strict,
          interactive, external, data-schematic.

      - key: ckanext.webpageviewplus.harden_downloads
        default: true
        type: bool
        description: |
          Add a CSP sandbox (without allow-same-origin) to HTML, SVG and XML
          that CKAN serves from its own origin: resource downloads and the
          resource proxy. Pages still render and run scripts, but can't act
          as CKAN with the viewer's session. Changes core behaviour: such a
          page opened from its download link loses storage and a real origin
          (e.g. a qsv Data Schematic's maps), until a content origin serves
          it instead.

      - key: ckanext.webpageviewplus.frameability_check
        default: false
        type: bool
        description: |
          Warn editors, as they type a page URL, when that page refuses to be
          framed (X-Frame-Options or CSP frame-ancestors). It never blocks
          saving. Saving a view checks its page and stores the answer, and a
          view whose page refuses framing then shows a card instead of a
          blank frame (rendering never fetches). Off by default: turning it
          on makes the CKAN server request URLs editors type, only those
          resolving to public addresses.

      - key: ckanext.webpageviewplus.thumbnail_fetch
        default: false
        type: bool
        description: |
          With the webpage_view_plus_thumbnails plugin: let CKAN fetch
          thumbnails when a view is saved, from the page's own preview image
          (og:image, then twitter:image) and from linked image resources an
          editor picks. Each image is fetched once, re-encoded small and
          served by CKAN, so visitors never contact the other site. Off by
          default: turning it on makes the CKAN server request page and image
          URLs, only those resolving to public addresses (at most 512 KB of a
          page, 2 MB of an image). Editors can turn it off per view.

      - key: ckanext.webpageviewplus.service_format
        default: false
        type: bool
        description: |
          With the webpage_view_plus_thumbnails plugin: when a view is saved
          on a resource whose only view shows a well-known service's page,
          and whose format is empty or HTML, set the resource's format to the
          service's name (YouTube, Datawrapper...), so the Formats facet can
          list them. Off by default: format is published as DCAT's
          dct:format, where profiles expect a media type, and it's in the
          API. It never overwrites any other format, and isn't reverted if
          the view changes later.

      - key: ckanext.webpageviewplus.editor_can_loosen
        default: false
        type: bool
        description: |
          Whether editors (not only sysadmins) may set a view's sandbox,
          allow and referrer policy beyond its preset.

      - key: ckanext.webpageviewplus.referrer_policy
        default: strict-origin-when-cross-origin
        description: |
          Default referrerpolicy for the iframe.

      - key: ckanext.webpageviewplus.credentialless
        default: ""
        type: list
        description: |
          Space-separated presets whose frames of third-party pages get the
          credentialless attribute: the page loads without the visitor's
          cookies or existing storage, in a throwaway storage partition.
          Never applied to uploads or pages on CKAN's own hosts, which need
          the visitor's CKAN session for private resources. Chromium only (other
          browsers ignore it), so it is extra hardening, never a security
          boundary. Logins inside the frame stop working, and popups it opens
          can't talk back to it (no OAuth popups). Listing external usually
          defeats its purpose, which is running a third-party app with its
          own login. Empty (the default) turns it off.

      - key: ckanext.webpageviewplus.min_height
        default: 400
        type: int
        description: |
          Minimum height, in px, for viewport and auto heights.

      - key: ckanext.webpageviewplus.max_height
        default: 4000
        type: int
        description: |
          Maximum height, in px, for viewport and auto heights.

      - key: ckanext.webpageviewplus.site_aliases
        default: ""
        type: list
        description: |
          Other hosts this CKAN site is reachable under (bare hosts or URLs),
          besides ckan.site_url's. Pages on any of them count as CKAN's own,
          whatever the scheme or port, so they never get a sandbox that lets
          scripts keep their origin.

      - key: ckanext.webpageviewplus.allowed_hosts
        default: ""
        type: list
        description: |
          Optional space-separated allow-list of hosts an external page_url
          may point to. Empty allows any host.

      - key: ckanext.webpageviewplus.controls
        default: open fullscreen reload share
        type: list
        description: |
          Buttons in the control bar under each view, from: open (in a new
          tab), fullscreen (Expand where the browser has no element
          fullscreen, e.g. iPhone Safari), reload, share (the CKAN page's
          URL, via the browser's share sheet; shown only where
          navigator.share exists). Empty hides the bar on every view.

      - key: ckanext.webpageviewplus.privacy_profile
        default: default
        description: |
          default, or eu: with eu, every view of a third-party page, whatever
          its preset, shows a consent card ("This view loads content from
          <host>") before anything is requested from that host. A sandbox
          doesn't stop the browser sending the visitor's cookies for that
          host, so the host can still tell who is looking. Today this is the
          same as consent_gate = true; eu is where further EU defaults go.

      - key: ckanext.webpageviewplus.consent_gate
        default: false
        type: bool
        description: |
          Show the consent card on every view of a third-party page, whatever
          the preset. Editors can also turn it on per view. Uploads and
          CKAN's own pages never get it. A browser sending Global Privacy
          Control (Sec-GPC: 1) gets it on every third-party view regardless.

      - key: ckanext.webpageviewplus.view_counting
        default: false
        type: bool
        description: |
          Let resource editors turn on view counting per view. Counting
          keeps per-view daily totals (impressions, seen, loaded, engaged,
          failed) and nothing about viewers; Global Privacy Control browsers
          and obvious bots aren't counted. Needs the plugin's tables:
          ckan db upgrade -p webpage_view_plus.

      - key: ckanext.webpageviewplus.view_counting_retention_days
        default: 365
        type: int
        description: |
          Days of daily totals to keep. ckan webpageviewplus purge-stats
          deletes older ones (run it from cron).

      - key: ckanext.webpageviewplus.privacy_policy_url
        default: ""
        description: |
          The site's privacy policy, linked from the "This view counts
          visits" notice. Required when view_counting is on.

      - key: ckanext.webpageviewplus.connection_reports
        default: false
        type: bool
        description: |
          Send Content-Security-Policy-Report-Only on HTML uploads served
          from the content origin, so CKAN learns which hosts those pages
          contact (kept as hosts per resource, nothing else). It never
          blocks anything. Off by default: each report request from a
          visitor's browser is a database write. Needs ckan db upgrade -p
          webpage_view_plus.

      - key: ckanext.webpageviewplus.show_connections
        default: false
        type: bool
        description: |
          Show "This page connects to <hosts>" under views of uploads, from
          those reports. Anyone can post a report, so the list is a hint,
          not proof; off by default.

      - key: ckanext.webpageviewplus.narrow_width
        default: 576
        type: int
        description: |
          Below this view width, in px, views whose height is an aspect ratio
          or a share of the window switch to 80% of the screen's height
          (svh), so a 16:9 frame on a phone isn't a thin strip. Fixed and
          auto heights are unchanged. 0 turns it off. Needs the view's
          script.

      - key: ckanext.webpageviewplus.color_scheme
        default: auto
        description: |
          The colour scheme framed pages see as prefers-color-scheme: auto
          (the viewer's OS), light or dark. A site with a fixed light or dark
          theme can set it so a page that follows prefers-color-scheme (a qsv
          Data Schematic, say) matches the portal. Sets CSS color-scheme on
          the iframe, which only Firefox honours for these frames so far:
          Chrome and Safari keep following the OS. A page's own stored choice
          (qsv's qsv-viz-theme) still wins.

      - key: ckanext.webpageviewplus.formats
        default: ""
        type: list
        description: |
          Resource formats (and URL extensions), e.g. "html htm", that also
          get a view where ckan.views.default_views lists webpage_view_plus.
          Links to well-known services get one without being listed. The
          view is offered on every resource either way.

      - key: ckanext.webpageviewplus.default_view_services
        default: >-
          youtube vimeo datawrapper flourish observable tableau-public power-bi
          arcgis-storymaps carto plotly-cloud google-forms typeform arcgis-online
          looker-studio google-sheets google-docs google-slides our-world-in-data
          streamlit hugging-face-spaces shinyapps-io infogram felt umap
          openstreetmap internet-archive sketchfab google-colab
        type: list
        description: |
          Well-known services whose links get a view where
          ckan.views.default_views lists webpage_view_plus, by key (the
          service's name in lower case, other characters as "-": youtube,
          tableau-public, shinyapps-io). Every service but microsoft-office and
          jupyter by default: they match a link to any .docx, .xlsx...
          or .ipynb file on any site, and their views send the file's address
          to Microsoft or nbviewer. Empty: no service gets one.

      - key: ckanext.webpageviewplus.pdf_max_size
        default: 25
        type: int
        description: |
          pdf_view_plus: the largest PDF on another site, in MB, that CKAN
          fetches to show it. CKAN holds the file in memory while fetching
          it, then keeps a copy under ckan.storage_path. Uploaded PDFs have
          no limit here.

      - key: ckanext.webpageviewplus.pdf_cache_seconds
        default: 3600
        type: int
        description: |
          pdf_view_plus: how long CKAN keeps its copy of a PDF linked from
          another site (under ckan.storage_path, shared by every visitor)
          before fetching it again, and how long browsers and caches may
          keep it for a public dataset. Such a file is public at its source,
          so there's nothing to revoke; uploads are revalidated on every use
          as before.
          Linked PDFs need ckan.storage_path, where the copies are kept.
