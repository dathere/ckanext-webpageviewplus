# Codacy analysis scope. Tests and agent instructions aren't product code:
# their findings (fixture "secrets", test helpers' complexity, prose-style
# rules on CLAUDE.md) say nothing about the extension's quality.
exclude_paths:
  - "CLAUDE.md"
  - ".serena/**"
  - "ckanext/webpageviewplus/tests/**"
  - "browser_tests/**"

# Lizard's per-function complexity issues are suppressed on purpose. The
# functions it flags (build_frame, view_after_validator,
# setup_template_variables, settings.check, ...) carry the security model
# and must change together; splitting them to meet a cyclomatic limit of 8 adds risk, not quality.
# The metric engine stays on: Codacy's grade needs its line counts.
engines:
  lizard:
    exclude_paths:
      - "**"
