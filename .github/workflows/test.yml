name: Tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        ckan-version: ["2.10", "2.11", "2.12"]
    name: CKAN ${{ matrix.ckan-version }}
    runs-on: ubuntu-latest
    container:
      # The CKAN version tag of the Solr and Postgres containers should match
      # the one of the container the tests run on.
      # You can switch this base image with a custom image tailored to your project
      image: ckan/ckan-dev:${{ matrix.ckan-version }}
      # Run as root so actions/checkout can write to the runner's file-command
      # dir; the ckan-dev:2.11 image otherwise runs as a non-root user (EACCES).
      options: --user root
    services:
      solr:
        image: ckan/ckan-solr:${{ matrix.ckan-version }}-solr9
      postgres:
        image: ckan/ckan-postgres-dev:${{ matrix.ckan-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
          image: redis:7

    env:
      CKAN_SQLALCHEMY_URL: postgresql://ckan_default:pass@postgres/ckan_test
      CKAN_DATASTORE_WRITE_URL: postgresql://datastore_write:pass@postgres/datastore_test
      CKAN_DATASTORE_READ_URL: postgresql://datastore_read:pass@postgres/datastore_test
      CKAN_SOLR_URL: http://solr:8983/solr/ckan
      CKAN_REDIS_URL: redis://redis:6379/1

    steps:
    - uses: actions/checkout@v4
    - name: Install requirements
      # Install any extra requirements your extension has here (dev requirements, other extensions etc)
      run: |
        pip install -r requirements.txt
        pip install -r dev-requirements.txt
        pip install -e .
    - name: Setup extension
      # Extra initialization steps
      # test.ini already points at /srv/app/src/ckan/test-core.ini, the path in ckan-dev images
      run: |
        ckan -c test.ini db init
        ckan -c test.ini db upgrade -p webpage_view_plus
    - name: Run tests
      run: pytest --ckan-ini=test.ini --cov=ckanext.webpageviewplus --cov-report=xml --disable-warnings ckanext/webpageviewplus
    - name: Keep the coverage report
      if: matrix.ckan-version == '2.11'
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: coverage.xml

  coverage:
    # Sends coverage to Codacy. A separate job because the ckan-dev image has
    # no curl, which the reporter needs. Skipped without the secret (forks).
    name: Coverage to Codacy
    needs: test
    runs-on: ubuntu-latest
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
    steps:
    - uses: actions/download-artifact@v4
      if: env.CODACY_PROJECT_TOKEN != ''
      with:
        name: coverage
    - uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
      if: env.CODACY_PROJECT_TOKEN != ''
      with:
        project-token: ${{ env.CODACY_PROJECT_TOKEN }}
        coverage-reports: coverage.xml

  browser:
    # A real CKAN served on localhost with a content origin on 127.0.0.1,
    # driven by Playwright in Chromium, Firefox and WebKit (browser_tests/).
    name: Browsers (CKAN 2.11)
    runs-on: ubuntu-latest
    container:
      image: ckan/ckan-dev:2.11
      options: --user root
    services:
      solr:
        image: ckan/ckan-solr:2.11-solr9
      postgres:
        image: ckan/ckan-postgres-dev:2.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
          image: redis:7
    env:
      CKAN_SQLALCHEMY_URL: postgresql://ckan_default:pass@postgres/ckan_test
      CKAN_DATASTORE_WRITE_URL: postgresql://datastore_write:pass@postgres/datastore_test
      CKAN_DATASTORE_READ_URL: postgresql://datastore_read:pass@postgres/datastore_test
      CKAN_SOLR_URL: http://solr:8983/solr/ckan
      CKAN_REDIS_URL: redis://redis:6379/1
      CKAN_INI: browser_tests/ci.ini
      WVP_BASE_URL: http://localhost:5000
      # Firefox won't run as root with a $HOME owned by another user (the
      # runner's /github/home). Set for the whole job so the browsers are
      # installed to and launched from the same cache.
      HOME: /root
    steps:
    - uses: actions/checkout@v4
    - name: Install requirements
      run: |
        pip install -r requirements.txt
        pip install -e .
        pip install -r browser_tests/requirements.txt
        python -m playwright install --with-deps chromium firefox webkit
    - name: Start CKAN with seeded data
      run: |
        ckan -c "$CKAN_INI" db init
        ckan -c "$CKAN_INI" db upgrade -p webpage_view_plus
        python browser_tests/seed.py
        nohup setsid ckan -c "$CKAN_INI" run -H 0.0.0.0 -p 5000 -r -t > /tmp/ckan.log 2>&1 &
        python - <<'EOF' || { cat /tmp/ckan.log; exit 1; }
        import os, time, urllib.request
        url = os.environ["WVP_BASE_URL"] + "/api/3/action/status_show"
        for _ in range(60):
            try:
                urllib.request.urlopen(url, timeout=5)
                break
            except Exception:
                time.sleep(2)
        else:
            raise SystemExit("CKAN did not start")
        EOF
    - name: Run browser tests
      # They use no pytest plugins; the image's CKAN plugin doesn't load
      # under the pinned pytest.
      env:
        PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      run: pytest -p no:cacheprovider browser_tests
    - name: CKAN log
      if: failure()
      run: tail -200 /tmp/ckan.log

