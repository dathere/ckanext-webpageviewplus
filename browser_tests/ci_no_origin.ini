; A second CKAN for the browser tests in CI, on the same database as ci.ini's
; (and so the same seeded data), on port 5002 with no content origin and
; pdf_without_content_origin on: test_pdf_ckan_host.py.
[DEFAULT]
debug = false

[app:main]
use = config:ci.ini
ckan.site_url = http://localhost:5002
ckanext.webpageviewplus.content_origin =
ckanext.webpageviewplus.pdf_without_content_origin = true

[loggers]
keys = root, ckan

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_ckan]
qualname = ckan
handlers =
level = INFO

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
