; CKAN config for the browser tests in CI: CKAN on localhost, uploads served
; from a content origin on 127.0.0.1 (browsers treat the two as different
; sites), as on the dev stack. Database, Solr and Redis come from CKAN_* env
; vars. The signing secret is a CI-only value.
[DEFAULT]
debug = false

[app:main]
use = config:/srv/app/src/ckan/test-core.ini
ckan.site_url = http://localhost:5000
ckan.plugins = webpage_view_plus
ckan.storage_path = /tmp/ckan-storage
ckanext.webpageviewplus.content_origin = http://127.0.0.1:5000
ckanext.webpageviewplus.signing_secret = ci-only-signing-secret-0123456789abcdef
# Opt-in (default auto); set so test_theme.py has something to check.
ckanext.webpageviewplus.color_scheme = light
# Opt-in (default off); on so the counting browser test has a counted view.
ckanext.webpageviewplus.view_counting = true
ckanext.webpageviewplus.privacy_policy_url = http://localhost:5000/privacy

[loggers]
keys = root, ckan

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_ckan]
qualname = ckan
handlers =
level = INFO

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
